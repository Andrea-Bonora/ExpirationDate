<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyDocsApp</title>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyDocs">

    <script>
      (function() {
          const canvas = document.createElement('canvas');
          canvas.width = 180; canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0891b2'; ctx.fillRect(0, 0, 180, 180);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(40, 30, 100, 120);
          ctx.fillStyle = '#0891b2';
          ctx.fillRect(55, 50, 70, 10);
          ctx.fillRect(55, 75, 70, 10);
          ctx.fillRect(55, 100, 40, 10);
          const link = document.createElement('link');
          link.rel = 'apple-touch-icon';
          link.href = canvas.toDataURL('image/png');
          document.head.appendChild(link);
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body class="bg-black text-white overflow-x-hidden min-h-screen" style="background-image: linear-gradient(135deg, #1e3a8a 0%, #111827 50%, #701a75 100%);">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center z-[100] relative">
                            <div className="bg-white/10 backdrop-blur-xl border border-rose-500/50 p-8 rounded-3xl w-full max-w-md shadow-2xl">
                                <h2 className="text-2xl font-black text-white mb-2">Errore Imprevisto</h2>
                                <p className="text-white/70 text-sm mb-4">L'app si è interrotta a causa di un limite di memoria di iOS.</p>
                                <div className="bg-black/50 p-3 rounded-lg text-rose-300 font-mono text-xs overflow-auto text-left mb-6 max-h-32">{this.state.error?.toString()}</div>
                                <button onClick={() => window.location.reload()} className="w-full py-4 bg-rose-500 hover:bg-rose-400 text-white font-bold rounded-full transition-colors shadow-lg">Riavvia l'App</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const Icons = {
            Home: () => <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Plus: () => <svg viewBox="0 0 24 24" className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Save: () => <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Settings: () => <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Camera: () => <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
            Trash: () => <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            Lock: () => <svg viewBox="0 0 24 24" className="w-12 h-12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Folder: () => <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            File: () => <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
        };

        const GlassCard = ({ children, className = '', onClick }) => (
            <div onClick={onClick} className={`bg-white/20 backdrop-blur-xl border border-white/30 p-6 shadow-2xl ${className}`}>{children}</div>
        );
        const GlassButton = ({ children, className = '', ...props }) => (
            <button {...props} className={`bg-white/20 backdrop-blur-lg border border-white/40 hover:bg-white/30 text-white transition-all duration-300 flex items-center justify-center gap-2 ${className}`}>{children}</button>
        );
        const GlassInput = (props) => (
            <input {...props} className={`block bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-white placeholder:text-white/60 focus:ring-2 focus:ring-sky-200 outline-none w-full min-w-0 box-border m-0 appearance-none ${props.className || ''}`} />
        );
        const GlassDateInput = ({ value, onChange, placeholder }) => {
            const [type, setType] = useState('text');
            return (
                <GlassInput
                    type={value ? 'date' : type}
                    placeholder={placeholder}
                    onFocus={() => setType('date')}
                    onBlur={() => setType('text')}
                    value={value}
                    onChange={onChange}
                />
            );
        };

        // ==========================================
        // CONFIGURAZIONE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBCvUfyCeAhnPbmwRiPJyfDQORkjRIhFqo",
            authDomain: "marathonapp-c58f6.firebaseapp.com",
            projectId: "marathonapp-c58f6",
            storageBucket: "marathonapp-c58f6.firebasestorage.app",
            messagingSenderId: "1069829485856",
            appId: "1:1069829485856:web:32de2e2f3ff12d27d19345",
            measurementId: "G-791179V957"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        // ==========================================

        const ACTIVITIES_MAP = {
            'Patente di guida': 'Documenti',
            "Carta d'Identità": 'Documenti',
            'Passaporto': 'Documenti',
            'Visita Medica Sportiva': 'Salute',
            'Pulizia dei denti': 'Salute',
            'Bollo Auto': 'Veicoli',
            'Assicurazione Auto': 'Veicoli',
            'Revisione Auto': 'Veicoli',
            'Altro': 'Varie'
        };

        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); 
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const MAX_SIZE = 800; 
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_SIZE) {
                                    height *= MAX_SIZE / width;
                                    width = MAX_SIZE;
                                }
                            } else {
                                if (height > MAX_SIZE) {
                                    width *= MAX_SIZE / height;
                                    height = MAX_SIZE;
                                }
                            }

                            const canvas = document.createElement('canvas');
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.8));
                        } catch (err) { reject(err.message); }
                    };
                    img.onerror = () => reject("Impossibile leggere il file immagine");
                    img.src = e.target.result;
                };
                reader.onerror = () => reject("Errore caricamento file");
                reader.readAsDataURL(file);
            });
        };

        const getExpiryStatus = (dateStr) => {
            if (!dateStr) return { color: 'text-white/70', status: 'N/A' };
            const expiry = new Date(dateStr);
            const now = new Date();
            now.setHours(0,0,0,0);
            const diffTime = expiry - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { color: 'text-rose-400 font-bold', status: 'Scaduto' };
            if (diffDays <= 30) return { color: 'text-amber-400 font-bold', status: 'In scadenza' };
            return { color: 'text-emerald-400 font-medium', status: 'Valido' };
        };

        const Cassettiera = ({ documents, username, onDocClick }) => {
            const groupedDocs = useMemo(() => {
                const groups = {};
                documents.forEach(doc => {
                    if (!groups[doc.category]) groups[doc.category] = [];
                    groups[doc.category].push(doc);
                });
                return groups;
            }, [documents]);

            return (
                <div className="p-4 space-y-6 pt-10">
                    <div>
                        <h1 className="text-4xl font-black text-white mt-4">{username ? `Ciao, ${username}` : 'Archivio'}</h1>
                        <p className="text-white/70 mt-1 text-sm">I tuoi documenti e scadenze.</p>
                    </div>

                    <div className="pt-4 space-y-6">
                        {Object.keys(groupedDocs).length === 0 && (
                            <p className="text-white/50 text-center italic mt-10">Nessun documento. Clicca il tasto + per iniziare.</p>
                        )}
                        {Object.entries(groupedDocs).map(([category, items]) => (
                            <GlassCard key={category} className="rounded-3xl p-5 border-t-2 border-t-white/40">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-white">
                                    <Icons.Folder /> {category}
                                </h3>
                                <div className="space-y-3">
                                    {items.map(doc => {
                                        const expiry = getExpiryStatus(doc.scadenza);
                                        return (
                                            <div key={doc.id} onClick={() => onDocClick(doc)} className="bg-white/10 rounded-2xl p-3 flex justify-between items-center hover:bg-white/20 transition cursor-pointer border border-white/5">
                                                <div className="flex items-center gap-3 overflow-hidden">
                                                    {doc.photo ? (
                                                        <div className="w-12 h-12 rounded-xl flex-shrink-0 border border-white/20 overflow-hidden shadow-inner bg-black/20">
                                                            <img src={doc.photo} className="w-full h-full object-cover" />
                                                        </div>
                                                    ) : (
                                                        <div className="w-12 h-12 rounded-xl flex-shrink-0 border border-white/10 bg-white/5 flex items-center justify-center text-white/50">
                                                            <Icons.File />
                                                        </div>
                                                    )}
                                                    <div className="min-w-0">
                                                        <p className="text-base font-bold text-white truncate">{doc.name}</p>
                                                        <p className={`text-xs mt-0.5 truncate ${expiry.color}`}>
                                                            Scad: {doc.scadenza ? new Date(doc.scadenza).toLocaleDateString('it-IT') : 'Nessuna'}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </GlassCard>
                        ))}
                    </div>
                </div>
            );
        };

        const Impostazioni = ({ username, saveUsername }) => {
            const [tempName, setTempName] = useState(username || '');
            return (
              <div className="p-4 space-y-6 pt-10">
                  <h1 className="text-4xl font-black text-white mt-4">Impostazioni</h1>
                  <GlassCard className="rounded-3xl mt-6 p-6">
                      <p className="text-sky-200 text-xs font-bold mb-3 uppercase tracking-wider">Il Tuo Profilo</p>
                      <div className="flex gap-2">
                        <GlassInput value={tempName} onChange={(e) => setTempName(e.target.value)} placeholder="Il tuo nome..." className="text-md" />
                        <GlassButton onClick={() => {if(tempName) saveUsername(tempName)}} className="px-6 bg-sky-500 font-bold">Salva</GlassButton>
                      </div>
                      <button onClick={() => auth.signOut()} className="w-full py-4 mt-8 bg-rose-500/20 hover:bg-rose-500/40 border border-rose-500/50 text-rose-300 font-bold rounded-2xl transition-colors">Disconnettiti</button>
                  </GlassCard>
              </div>
            );
        };

        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');

            const handleAuth = async () => {
                if (!email || !password) return alert("Compila tutti i campi");
                try {
                    if (isLogin) { await auth.signInWithEmailAndPassword(email, password); } 
                    else {
                        if (!name) return alert("Inserisci il tuo nome!");
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        await db.collection("settings").doc(cred.user.uid).set({ name });
                    }
                } catch (e) { alert("Errore: " + e.message); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 z-10 relative">
                    <GlassCard className="rounded-3xl w-full max-w-sm text-center p-8 space-y-6 border-t-2 border-t-white/40">
                        <div className="flex justify-center text-sky-300"><Icons.Lock /></div>
                        <h2 className="text-2xl font-black text-white">{isLogin ? 'Bentornato' : 'Registrati'}</h2>
                        <div className="space-y-3">
                            {!isLogin && <GlassInput value={name} onChange={e => setName(e.target.value)} placeholder="Il tuo Nome" type="text" />}
                            <GlassInput value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" type="email" />
                            <GlassInput value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" type="password" />
                        </div>
                        <GlassButton onClick={handleAuth} className="w-full py-3 bg-sky-500 font-bold border-sky-400">{isLogin ? 'Accedi' : 'Crea Account'}</GlassButton>
                        <p className="text-xs text-white/50 pt-2 cursor-pointer hover:text-white transition-colors" onClick={() => setIsLogin(!isLogin)}>
                            {isLogin ? "Non hai un account? Registrati" : "Hai già un account? Accedi"}
                        </p>
                    </GlassCard>
                </div>
            )
        };

        function App() {
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState('');
            const [activeTab, setActiveTab] = useState('home');
            const [isAddOpen, setIsAddOpen] = useState(false);
            const [documents, setDocuments] = useState([]);
            const [loading, setLoading] = useState(false);
            
            const [newDoc, setNewDoc] = useState({ name: 'Patente di guida', dataSvolgimento: '', scadenza: '' });
            const [photoProcessed, setPhotoProcessed] = useState(null);
            
            const [selectedDoc, setSelectedDoc] = useState(null); 
            const [isProcessing, setIsProcessing] = useState(false);

            useEffect(() => {
                if (firebaseConfig.apiKey === "INCOLLA_QUI") return;
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (u) {
                        db.collection("settings").doc(u.uid).get().then(doc => { if(doc.exists) setUsername(doc.data().name); });
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsubscribe = db.collection("user_documents")
                                      .where("userId", "==", user.uid)
                                      .onSnapshot((snapshot) => {
                    const docsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort by scadenza (soonest first)
                    docsData.sort((a,b) => new Date(a.scadenza) - new Date(b.scadenza)); 
                    setDocuments(docsData);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const saveUsername = (newName) => { db.collection("settings").doc(user.uid).set({ name: newName }); setUsername(newName); };

            const handlePhotoSelection = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    setIsProcessing(true);
                    const processedBase64 = await compressImage(file);
                    setPhotoProcessed(processedBase64);
                } catch (err) {
                    alert("Errore: " + err);
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleSaveNewDoc = () => {
                if (!newDoc.name || !newDoc.scadenza) return alert("Inserisci Nome e Scadenza!");
                const category = ACTIVITIES_MAP[newDoc.name] || 'Varie';
                
                const docToAdd = {
                    userId: user.uid, 
                    name: newDoc.name, 
                    category: category,
                    dataSvolgimento: newDoc.dataSvolgimento, 
                    scadenza: newDoc.scadenza,
                    photo: photoProcessed 
                };
                
                db.collection("user_documents").add(docToAdd).then(() => {
                    setIsAddOpen(false); 
                    setNewDoc({ name: 'Patente di guida', dataSvolgimento: '', scadenza: '' }); 
                    setPhotoProcessed(null);
                }).catch(err => alert("Errore: " + err.message));
            };

            const confirmDeleteDoc = () => {
                if (!selectedDoc) return;
                db.collection("user_documents").doc(selectedDoc.id).delete().then(() => setSelectedDoc(null)).catch(err => alert("Errore: " + err.message));
            };

            if (!user) {
                return (
                  <div className="relative">
                      <div className="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-cyan-500/30 rounded-full blur-[120px] pointer-events-none z-0"></div>
                      <div className="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-magenta-500/30 rounded-full blur-[120px] pointer-events-none z-0"></div>
                      <AuthScreen />
                  </div>
                );
            }

            const isAnyModalOpen = isAddOpen || selectedDoc || isProcessing;

            return (
              <div className="relative min-h-screen">
                <div className="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-cyan-500/30 rounded-full blur-[120px] pointer-events-none z-0"></div>
                <div className="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-magenta-500/30 rounded-full blur-[120px] pointer-events-none z-0"></div>
                
                <div className="max-w-xl mx-auto pb-32 relative z-10 pt-safe">
                  {loading && <div className="text-center mt-20 text-white/50 font-medium">Caricamento archivio...</div>}
                  {!loading && activeTab === 'home' && <Cassettiera documents={documents} username={username} onDocClick={setSelectedDoc} />}
                  {!loading && activeTab === 'settings' && <Impostazioni username={username} saveUsername={saveUsername} />}
                </div>

                {/* NAVBAR EXACT 3 ITEMS */}
                {!isAnyModalOpen && (
                    <div className="fixed bottom-6 pb-safe left-0 right-0 flex justify-center z-40 px-4 pointer-events-none">
                      <div className="bg-black/60 backdrop-blur-2xl border border-white/10 rounded-full p-2 flex items-center justify-center gap-4 shadow-[0_20px_50px_rgba(0,0,0,0.8)] pointer-events-auto mx-auto w-max px-4">
                        <button onClick={() => setActiveTab('home')} className={`flex items-center justify-center w-14 h-14 rounded-full transition-all duration-300 ${activeTab === 'home' ? 'bg-white/20 text-white' : 'text-white/40 hover:text-white'}`}>
                            <Icons.Home />
                        </button>
                        
                        <button onClick={() => setIsAddOpen(true)} className="w-16 h-16 bg-gradient-to-tr from-sky-600 to-sky-400 rounded-full flex flex-shrink-0 items-center justify-center text-white shadow-[0_4px_15px_rgba(14,165,233,0.5)] hover:scale-105 transition-transform mx-2">
                            <Icons.Plus />
                        </button>
                        
                        <button onClick={() => setActiveTab('settings')} className={`flex items-center justify-center w-14 h-14 rounded-full transition-all duration-300 ${activeTab === 'settings' ? 'bg-white/20 text-white' : 'text-white/40 hover:text-white'}`}>
                            <Icons.Settings />
                        </button>
                      </div>
                    </div>
                )}

                {/* MODAL: PROCESSING SPINNER */}
                {isProcessing && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[70] flex flex-col items-center justify-center p-4">
                        <div className="w-12 h-12 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold text-white">Elaborazione Foto...</h2>
                    </div>
                )}

                {/* MODAL: VIEW DETAILS / DELETE */}
                {selectedDoc && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[50] flex items-center justify-center p-4" onClick={() => setSelectedDoc(null)}>
                        <GlassCard className="rounded-3xl w-full max-w-sm relative text-center border-white/20 p-8 max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setSelectedDoc(null)} className="absolute top-4 right-4 text-white/50 hover:text-white bg-black/20 rounded-full p-1"><Icons.X /></button>
                            
                            <div className="flex-1 overflow-y-auto no-scrollbar pb-6">
                                <h2 className="text-3xl font-black text-white mb-2 leading-tight">{selectedDoc.name}</h2>
                                <p className="text-white/70 font-bold mb-4 uppercase tracking-widest text-xs">{selectedDoc.category}</p>
                                
                                <div className="grid grid-cols-2 gap-3 mb-6 text-left">
                                    <div className="bg-white/5 rounded-2xl p-4 border border-white/10">
                                        <p className="text-[10px] uppercase text-white/50 font-bold">Data Svolg.</p>
                                        <p className="font-semibold text-white mt-1">{selectedDoc.dataSvolgimento ? new Date(selectedDoc.dataSvolgimento).toLocaleDateString('it-IT') : '-'}</p>
                                    </div>
                                    <div className={`bg-white/5 rounded-2xl p-4 border border-white/10 ${getExpiryStatus(selectedDoc.scadenza).color.includes('rose') ? 'border-rose-500/50 bg-rose-500/10' : ''}`}>
                                        <p className="text-[10px] uppercase text-white/50 font-bold">Scadenza</p>
                                        <p className={`font-semibold mt-1 ${getExpiryStatus(selectedDoc.scadenza).color}`}>{selectedDoc.scadenza ? new Date(selectedDoc.scadenza).toLocaleDateString('it-IT') : '-'}</p>
                                    </div>
                                </div>

                                {selectedDoc.photo ? (
                                    <div className="w-full rounded-2xl border-4 border-white/10 overflow-hidden bg-black/20 shadow-xl">
                                        <img src={selectedDoc.photo} className="w-full h-auto object-contain" />
                                    </div>
                                ) : (
                                    <div className="w-full h-32 rounded-2xl border-2 border-dashed border-white/20 flex flex-col items-center justify-center text-white/30 bg-white/5">
                                        <Icons.File />
                                        <span className="text-sm mt-2">Nessuna foto</span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="pt-4 mt-auto border-t border-white/10">
                                <button onClick={confirmDeleteDoc} className="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-2xl transition-colors shadow-lg shadow-rose-500/30 flex items-center justify-center gap-2">
                                    <Icons.Trash /> Elimina Documento
                                </button>
                            </div>
                        </GlassCard>
                    </div>
                )}

                {/* MODAL: ADD DOCUMENT */}
                {isAddOpen && (
                  <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[45] flex items-center justify-center p-4 pt-10">
                    <GlassCard className="rounded-3xl w-full max-w-sm relative p-8 max-h-[85vh] overflow-y-auto no-scrollbar border-t-2 border-t-white/40">
                      <button onClick={() => { setIsAddOpen(false); setPhotoProcessed(null); }} className="absolute top-4 right-4 text-white/50 hover:text-white bg-black/20 rounded-full p-1"><Icons.X /></button>
                      <h2 className="text-2xl font-bold mb-6 text-white flex items-center gap-2">Nuova Registrazione</h2>
                      
                      <div className="space-y-4">
                        <div>
                            <label className="text-xs font-bold text-sky-200 uppercase tracking-wider mb-2 block">Attività / Documento</label>
                            <select value={newDoc.name} onChange={(e) => setNewDoc({...newDoc, name: e.target.value})} className="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-white focus:ring-2 focus:ring-sky-200 outline-none w-full box-border min-w-0 m-0 appearance-none font-semibold">
                                <optgroup label="Documenti" className="text-black">
                                    <option className="text-black">Patente di guida</option>
                                    <option className="text-black">Carta d'Identità</option>
                                    <option className="text-black">Passaporto</option>
                                </optgroup>
                                <optgroup label="Salute" className="text-black">
                                    <option className="text-black">Visita Medica Sportiva</option>
                                    <option className="text-black">Pulizia dei denti</option>
                                </optgroup>
                                <optgroup label="Veicoli" className="text-black">
                                    <option className="text-black">Bollo Auto</option>
                                    <option className="text-black">Assicurazione Auto</option>
                                    <option className="text-black">Revisione Auto</option>
                                </optgroup>
                                <optgroup label="Varie" className="text-black">
                                    <option className="text-black">Altro</option>
                                </optgroup>
                            </select>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1 block">Data Svolgimento</label>
                                <GlassDateInput placeholder="Data Svolgimento" value={newDoc.dataSvolgimento} onChange={(e) => setNewDoc({...newDoc, dataSvolgimento: e.target.value})} />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-rose-300 uppercase tracking-wider mb-1 block">Scadenza *</label>
                                <GlassDateInput placeholder="Scadenza" value={newDoc.scadenza} onChange={(e) => setNewDoc({...newDoc, scadenza: e.target.value})} />
                            </div>
                        </div>
                        
                        <div>
                            <label className="text-xs font-bold text-sky-200 uppercase tracking-wider mb-2 block mt-2">Allega Foto (Opzionale)</label>
                            <label className={`flex items-center justify-center w-full p-4 bg-white/5 backdrop-blur-md border border-dashed rounded-2xl cursor-pointer hover:bg-white/10 transition-all font-medium box-border m-0 ${photoProcessed ? 'border-sky-400 text-sky-300 bg-sky-500/10' : 'border-white/30 text-white/80'}`}>
                                <Icons.Camera />
                                <span className="ml-2 truncate max-w-[200px]">{photoProcessed ? "Foto Pronta!" : "Scatta / Scegli foto"}</span>
                                <input type="file" accept="image/*" className="hidden" onChange={handlePhotoSelection} />
                            </label>

                            {photoProcessed && (
                                <div className="mt-3 w-full h-32 rounded-xl overflow-hidden border border-white/20 bg-black/40">
                                    <img src={photoProcessed} className="w-full h-full object-cover" />
                                </div>
                            )}
                        </div>

                        <GlassButton onClick={handleSaveNewDoc} className="rounded-2xl w-full py-4 bg-sky-500 border-sky-400 mt-6 font-bold tracking-wide shadow-lg shadow-sky-500/20 text-lg">
                          <Icons.Save /> Salva nel cassetto
                        </GlassButton>
                      </div>
                    </GlassCard>
                  </div>
                )}
              </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
