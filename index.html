      (function() {
          const canvas = document.createElement('canvas');
          canvas.width = 180; canvas.height = 180;
          const ctx = canvas.getContext('2d');
          
          // Sfondo
          ctx.fillStyle = '#1e293b'; 
          ctx.fillRect(0, 0, 180, 180);
          
          // Corpo Cassettiera
          ctx.fillStyle = '#475569'; 
          ctx.fillRect(30, 20, 120, 140);
          
          // Cassetti
          const drawDrawer = (y) => {
              ctx.fillStyle = '#334155'; ctx.fillRect(35, y, 110, 32);
              ctx.fillStyle = '#94a3b8'; ctx.fillRect(37, y+2, 106, 28);
              ctx.fillStyle = '#1e293b'; ctx.fillRect(80, y + 12, 20, 6);
              ctx.fillStyle = '#f8fafc'; ctx.fillRect(45, y + 10, 18, 10);
          }
          
          drawDrawer(25);
          drawDrawer(60);
          drawDrawer(95);
          drawDrawer(130);

          const link = document.createElement('link');
          link.rel = 'apple-touch-icon';
          link.href = canvas.toDataURL('image/png');
          document.head.appendChild(link);
      })();
    </script>

        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); 
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const MAX_SIZE = 800; 
                            let width = img.width; let height = img.height;
                            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                            const canvas = document.createElement('canvas');
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.75));
                        } catch (err) { reject(err.message); }
                    };
                    img.onerror = () => reject("Impossibile leggere il file immagine");
                    img.src = e.target.result;
                };
                reader.onerror = () => reject("Errore caricamento file");
                reader.readAsDataURL(file);
            });
        };

        const getExpiryStatus = (dateStr) => {
            if (!dateStr) return { color: 'text-white/40 font-medium', status: 'Nessuna scadenza' };
            const expiry = new Date(dateStr);
            const now = new Date();
            now.setHours(0,0,0,0);
            const diffTime = expiry - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { color: 'text-rose-400 font-bold', status: 'Scaduto' };
            if (diffDays <= 30) return { color: 'text-amber-400 font-bold', status: 'In scadenza' };
            return { color: 'text-emerald-400 font-medium', status: 'Valido' };
        };

        // --- SCHERMATA: CASSETTIERA (HOME) ---
        const Cassettiera = ({ documents, username, onDocClick, onSettingsClick }) => {
            const [collapsedCats, setCollapsedCats] = useState({});

            const groupedDocs = useMemo(() => {
                const groups = {};
                documents.forEach(doc => {
                    if (!groups[doc.category]) groups[doc.category] = [];
                    groups[doc.category].push(doc);
                });
                
                // Ordina documenti all'interno di ogni categoria
                Object.keys(groups).forEach(cat => {
                    groups[cat].sort((a, b) => {
                        if (!a.scadenza) return 1; // Quelli senza scadenza in fondo
                        if (!b.scadenza) return -1;
                        return new Date(a.scadenza) - new Date(b.scadenza);
                    });
                });

                return groups;
            }, [documents]);

            const toggleCat = (cat) => setCollapsedCats(prev => ({...prev, [cat]: !prev[cat]}));

            return (
                <div className="p-4 space-y-6 pt-10">
                    <div className="flex justify-between items-start mt-4">
                        <div>
                            <h1 className="text-4xl font-black text-white">{username ? `Ciao, ${username}` : 'Archivio'}</h1>
                            <p className="text-white/70 mt-1 text-sm">ExpirationDate - Schedario Personale</p>
                        </div>
                        <button onClick={onSettingsClick} className="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-colors text-white" title="Impostazioni Profilo">
                            <Icons.User />
                        </button>
                    </div>

                    <div className="pt-4 space-y-4">
                        {Object.keys(groupedDocs).length === 0 && (
                            <div className="text-center mt-12 opacity-50">
                                <div className="flex justify-center mb-4"><Icons.Folder /></div>
                                <p className="italic text-sm">Nessun documento in archivio.<br/>Tocca il tasto + per iniziare.</p>
                            </div>
                        )}
                        {Object.entries(groupedDocs).map(([category, items]) => (
                            <div key={category} className="glass-panel rounded-3xl overflow-hidden shadow-lg border-t border-t-white/30">
                                <button onClick={() => toggleCat(category)} className="w-full p-5 flex items-center justify-between bg-white/5 hover:bg-white/10 transition-colors">
                                    <h3 className="text-xl font-bold flex items-center gap-2 text-white">
                                        <Icons.Folder /> {category}
                                        <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full ml-2">{items.length}</span>
                                    </h3>
                                    <div className="text-white/50">{collapsedCats[category] ? <Icons.ChevronDown /> : <Icons.ChevronUp />}</div>
                                </button>
                                
                                {!collapsedCats[category] && (
                                    <div className="p-4 pt-0 space-y-2">
                                        {items.map(doc => {
                                            const hasExp = !!doc.scadenza;
                                            const expiry = getExpiryStatus(doc.scadenza);
                                            const isUrgent = hasExp && expiry.color.includes('rose');
                                            const dynamicLabel = ACTIVITIES.find(a => a.name === doc.name)?.label || 'Scadenza';

                                            return (
                                                <div key={doc.id} onClick={() => onDocClick(doc)} 
                                                    className={`rounded-2xl p-3 flex justify-between items-center transition cursor-pointer border ${isUrgent ? 'bg-rose-500/10 border-rose-500/30' : 'bg-black/20 hover:bg-black/40 border-white/5'} ${!hasExp ? 'opacity-70' : ''}`}>
                                                    <div className="flex items-center gap-3 overflow-hidden">
                                                        {doc.photo ? (
                                                            <div className={`w-12 h-12 rounded-xl flex-shrink-0 border overflow-hidden shadow-inner ${isUrgent ? 'border-rose-400/50' : 'border-white/20 bg-black/40'}`}>
                                                                <img src={doc.photo} className="w-full h-full object-cover" />
                                                            </div>
                                                        ) : (
                                                            <div className={`w-12 h-12 rounded-xl flex-shrink-0 border flex items-center justify-center ${isUrgent ? 'border-rose-400/30 bg-rose-500/20 text-rose-300' : 'border-white/10 bg-white/5 text-white/40'}`}>
                                                                <Icons.File />
                                                            </div>
                                                        )}
                                                        <div className="min-w-0">
                                                            <p className="text-[15px] font-bold text-white truncate leading-tight">{doc.name}</p>
                                                            {hasExp ? (
                                                                <p className={`text-[11px] mt-0.5 truncate uppercase font-bold tracking-wider ${expiry.color}`}>
                                                                    {dynamicLabel}: {new Date(doc.scadenza).toLocaleDateString('it-IT')}
                                                                </p>
                                                            ) : (
                                                                <p className="text-[11px] mt-0.5 uppercase font-medium tracking-wider text-white/40">Nessuna Scadenza</p>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- SCHERMATA: SCADENZE ---
        const Scadenze = ({ documents, onDocClick }) => {
            const [monthsFilter, setMonthsFilter] = useState(3); 

            const expiringDocs = useMemo(() => {
                const now = new Date();
                now.setHours(0,0,0,0);
                
                const filterDate = new Date();
                filterDate.setMonth(filterDate.getMonth() + monthsFilter);
                
                // Exclude documents with no deadline
                const filtered = documents.filter(doc => {
                    if (!doc.scadenza) return false;
                    const exp = new Date(doc.scadenza);
                    return exp <= filterDate; 
                });
                
                return filtered.sort((a,b) => new Date(a.scadenza) - new Date(b.scadenza));
            }, [documents, monthsFilter]);

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            return (
                <div className="p-4 space-y-6 pt-10">
                    <div className="mt-4 flex items-center gap-3">
                        <div className="text-sky-300 bg-sky-500/20 p-2 rounded-xl"><Icons.Clock /></div>
                        <div>
                            <h1 className="text-3xl font-black text-white">Scadenze</h1>
                        </div>
                    </div>
                    
                    {/* Time Filter Selector */}
                    <div className="flex bg-black/40 backdrop-blur-md rounded-xl p-1 border border-white/10 shadow-inner">
                        {[1, 3, 6].map(m => (
                            <button 
                                key={m} 
                                onClick={() => setMonthsFilter(m)}
                                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${monthsFilter === m ? 'bg-white/20 text-white shadow-sm' : 'text-white/50 hover:text-white/80'}`}
                            >
                                {m} {m === 1 ? 'Mese' : 'Mesi'}
                            </button>
                        ))}
                    </div>

                    <div className="pt-2 space-y-4">
                        {expiringDocs.length === 0 && (
                            <p className="text-white/50 text-center italic mt-10">Nessuna scadenza imminente nei prossimi {monthsFilter} mesi.</p>
                        )}
                        {expiringDocs.map(doc => {
                            const expDate = new Date(doc.scadenza);
                            const isCritical = expDate < new Date() || (expDate.getMonth() === currentMonth && expDate.getFullYear() === currentYear);
                            const dynamicLabel = ACTIVITIES.find(a => a.name === doc.name)?.label || 'Scadenza';
                            
                            return (
                                <div key={doc.id} onClick={() => onDocClick(doc)} 
                                     className={`glass-panel rounded-2xl p-4 flex justify-between items-center cursor-pointer transition-transform hover:scale-[1.02] border-l-4 ${isCritical ? 'border-l-rose-500 bg-rose-500/10' : 'border-l-amber-400 bg-amber-500/5'}`}>
                                    <div>
                                        <p className="text-lg font-bold text-white leading-tight">{doc.name}</p>
                                        <p className="text-xs text-white/60 font-semibold mt-1">{doc.category}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className={`text-xl font-black drop-shadow-md ${isCritical ? 'text-rose-400' : 'text-amber-400'}`}>
                                            {expDate.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' })}
                                        </p>
                                        <p className="text-[10px] uppercase text-white/50 mt-1 font-bold">
                                            {isCritical ? 'Critica / Scaduta' : dynamicLabel}
                                        </p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const handleAuth = async () => {
                if (!email || !password) return setErrorMsg("Compila tutti i campi");
                try {
                    if (isLogin) { await auth.signInWithEmailAndPassword(email, password); } 
                    else {
                        if (!name) return setErrorMsg("Inserisci il tuo nome!");
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        await db.collection("settings").doc(cred.user.uid).set({ name });
                    }
                } catch (e) { setErrorMsg("Errore: " + e.message); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 z-10 relative">
                    <Toast message={errorMsg} onClose={() => setErrorMsg('')} />
                    <div className="glass-panel rounded-3xl w-full max-w-sm text-center p-8 space-y-6 border-t border-t-white/40 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                        <div className="flex justify-center text-sky-300"><Icons.Lock /></div>
                        <h2 className="text-2xl font-black text-white">{isLogin ? 'Bentornato' : 'Registrati'}</h2>
                        <div className="space-y-3">
                            {!isLogin && <GlassInput value={name} onChange={e => setName(e.target.value)} placeholder="Il tuo Nome" type="text" />}
                            <GlassInput value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" type="email" />
                            <GlassInput value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" type="password" />
                        </div>
                        <button onClick={handleAuth} className="w-full py-3 bg-gradient-to-r from-sky-600 to-sky-400 font-bold rounded-xl shadow-lg hover:scale-105 transition-transform text-white">
                            {isLogin ? 'Accedi all\'Archivio' : 'Crea Account'}
                        </button>
                        <p className="text-xs text-white/50 pt-2 cursor-pointer hover:text-white transition-colors" onClick={() => setIsLogin(!isLogin)}>
                            {isLogin ? "Nuovo utente? Registrati ora" : "Hai già un account? Accedi"}
                        </p>
                    </div>
                </div>
            )
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [username, setUsername] = useState('');
            const [activeTab, setActiveTab] = useState('home');
            const [isAddOpen, setIsAddOpen] = useState(false);
            const [documents, setDocuments] = useState([]);
            const [loading, setLoading] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            
            // App states
            const [newDoc, setNewDoc] = useState({ name: '', dataSvolgimento: '', scadenza: '', note: '' });
            const [hasDeadline, setHasDeadline] = useState(true); // Toggle for Deadline
            const [selectedInterval, setSelectedInterval] = useState('manual');
            const [photoProcessed, setPhotoProcessed] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [showSearchDropdown, setShowSearchDropdown] = useState(false);
            
            const [selectedDoc, setSelectedDoc] = useState(null); 
            const [zoomedImage, setZoomedImage] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);

            // Duplicate Handling State
            const [duplicateModal, setDuplicateModal] = useState({ isOpen: false, newDocData: null, existingDocId: null });

            useEffect(() => {
                if (firebaseConfig.apiKey === "INCOLLA_QUI") return;
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (u) db.collection("settings").doc(u.uid).get().then(doc => { if(doc.exists) setUsername(doc.data().name); });
                    setIsAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const unsubscribe = db.collection("user_documents")
                                      .where("userId", "==", user.uid)
                                      .onSnapshot((snapshot) => {
                    const docsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setDocuments(docsData);
                    setLoading(false);
                }, (err) => {
                    console.error(err);
                    setToastMsg("Impossibile caricare i dati. Controlla le regole Firebase.");
                });
                return () => unsubscribe();
            }, [user]);

            const handleLogout = () => {
                setSettingsOpen(false);
                auth.signOut();
            };

            const handlePhotoSelection = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    setIsProcessing(true);
                    const processedBase64 = await compressImage(file);
                    setPhotoProcessed(processedBase64);
                } catch (err) {
                    setToastMsg("Errore foto: " + err);
                } finally {
                    setIsProcessing(false);
                }
            };

            const filteredActivities = useMemo(() => {
                if(!searchTerm) return ACTIVITIES;
                return ACTIVITIES.filter(a => a.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }, [searchTerm]);

            const executeSaveToDb = (docToAdd) => {
                db.collection("user_documents").add(docToAdd).then(() => {
                    setIsAddOpen(false); 
                    setNewDoc({ name: '', dataSvolgimento: '', scadenza: '', note: '' }); 
                    setSearchTerm('');
                    setPhotoProcessed(null);
                    setHasDeadline(true);
                    setSelectedInterval('manual');
                    setDuplicateModal({ isOpen: false, newDocData: null, existingDocId: null });
                    setToastMsg("Attività salvata con successo!");
                }).catch(err => setToastMsg("Errore salvataggio: " + err.message));
            };

            const handleSaveRequest = () => {
                const finalName = newDoc.name || searchTerm;
                if (!finalName) {
                    return setToastMsg("Inserisci il Nome dell'attività!");
                }
                
                let finalScadenza = newDoc.scadenza;

                // Calcolo automatico della data se è stato selezionato un intervallo
                if (hasDeadline && selectedInterval !== 'manual') {
                    const monthsToAdd = parseInt(selectedInterval, 10);
                    const baseDate = newDoc.dataSvolgimento ? new Date(newDoc.dataSvolgimento) : new Date();
                    const computedDate = new Date(baseDate);
                    computedDate.setMonth(computedDate.getMonth() + monthsToAdd);
                    
                    const yyyy = computedDate.getFullYear();
                    const mm = String(computedDate.getMonth() + 1).padStart(2, '0');
                    const dd = String(computedDate.getDate()).padStart(2, '0');
                    finalScadenza = `${yyyy}-${mm}-${dd}`;
                } else if (hasDeadline && !newDoc.scadenza) {
                    return setToastMsg("Inserisci la data di scadenza!");
                }
                
                // Validazione Data
                if (hasDeadline && newDoc.dataSvolgimento && finalScadenza) {
                    if (new Date(finalScadenza) < new Date(newDoc.dataSvolgimento)) {
                        return setToastMsg("La data futura non può essere precedente allo svolgimento!");
                    }
                }

                const activityDef = ACTIVITIES.find(a => a.name.toLowerCase() === finalName.toLowerCase());
                const category = activityDef ? activityDef.cat : 'Varie';
                
                const docToAdd = {
                    userId: user.uid, 
                    name: finalName, 
                    category: category,
                    dataSvolgimento: newDoc.dataSvolgimento, 
                    scadenza: hasDeadline ? finalScadenza : null, // Usa la data calcolata o quella manuale
                    note: newDoc.note || '',
                    photo: photoProcessed 
                };

                // DUPLICATE CHECK
                const existingDoc = documents.find(d => d.name.toLowerCase() === finalName.toLowerCase());
                if (existingDoc) {
                    setDuplicateModal({ isOpen: true, newDocData: docToAdd, existingDocId: existingDoc.id });
                } else {
                    executeSaveToDb(docToAdd);
                }
            };

            const handleReplaceDuplicate = () => {
                if(!duplicateModal.existingDocId) return;
                db.collection("user_documents").doc(duplicateModal.existingDocId).delete()
                  .then(() => {
                      executeSaveToDb(duplicateModal.newDocData);
                  })
                  .catch(err => setToastMsg("Errore sostituzione: " + err.message));
            };

            const confirmDeleteDoc = () => {
                if (!selectedDoc) return;
                db.collection("user_documents").doc(selectedDoc.id).delete()
                  .then(() => {
                      setSelectedDoc(null);
                      setToastMsg("Documento eliminato.");
                  })
                  .catch(err => setToastMsg("Errore eliminazione: " + err.message));
            };

            if (isAuthLoading) {
                return (
                    <div className="relative min-h-screen flex items-center justify-center z-50">
                        <div className="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
                        <div className="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-500/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
                        <div className="glass-panel p-8 rounded-3xl z-10 flex flex-col items-center shadow-2xl">
                            <div className="w-12 h-12 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <h2 className="text-xl font-bold text-white">Caricamento Archivio...</h2>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                  <div className="relative">
                      <div className="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
                      <div className="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-500/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
                      <AuthScreen />
                  </div>
                );
            }

            const isAnyModalOpen = isAddOpen || selectedDoc || isProcessing || zoomedImage || settingsOpen || duplicateModal.isOpen;

            // Determina la label dinamica e la presenza di intervalli per il form
            const currentActivityDef = ACTIVITIES.find(a => a.name.toLowerCase() === (newDoc.name || searchTerm).toLowerCase());
            const dynamicLabelAddForm = currentActivityDef ? currentActivityDef.label : 'Scadenza';
            const hasIntervals = currentActivityDef && currentActivityDef.intervals && currentActivityDef.intervals.length > 0;

            return (
              <div className="relative min-h-screen">
                <Toast message={toastMsg} onClose={() => setToastMsg('')} />
                
                {/* Background Orbs */}
                <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                    <div className="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-sky-500/20 rounded-full blur-[120px]"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-indigo-500/20 rounded-full blur-[120px]"></div>
                </div>
                
                <div className="max-w-xl mx-auto pb-32 relative z-10 pt-safe">
                  {loading && <div className="text-center mt-20 text-white/50 font-medium animate-pulse">Sincronizzazione archivio...</div>}
                  {!loading && activeTab === 'home' && <Cassettiera documents={documents} username={username} onDocClick={setSelectedDoc} onSettingsClick={() => setSettingsOpen(true)} />}
                  {!loading && activeTab === 'scadenze' && <Scadenze documents={documents} onDocClick={setSelectedDoc} />}
                </div>

                {/* NAVBAR BOTTOM */}
                {!isAnyModalOpen && (
                    <div className="fixed bottom-6 pb-safe left-0 right-0 flex justify-center z-40 px-4 pointer-events-none">
                      <div className="glass-panel rounded-full p-2 flex items-center justify-center gap-6 shadow-[0_20px_50px_rgba(0,0,0,0.6)] pointer-events-auto mx-auto w-max px-6">
                        <button onClick={() => setActiveTab('home')} className={`flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 ${activeTab === 'home' ? 'bg-white/20 text-white' : 'text-white/40 hover:text-white'}`}>
                            <Icons.Home />
                        </button>
                        
                        <button onClick={() => setIsAddOpen(true)} className="w-16 h-16 bg-gradient-to-tr from-sky-500 to-indigo-500 rounded-full flex flex-shrink-0 items-center justify-center text-white shadow-[0_4px_20px_rgba(14,165,233,0.4)] hover:scale-105 transition-transform">
                            <Icons.Plus />
                        </button>
                        
                        <button onClick={() => setActiveTab('scadenze')} className={`flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 ${activeTab === 'scadenze' ? 'bg-white/20 text-white' : 'text-white/40 hover:text-white'}`}>
                            <Icons.Clock />
                        </button>
                      </div>
                    </div>
                )}

                {/* MODAL: FULLSCREEN IMAGE ZOOM */}
                {zoomedImage && (
                    <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-3xl flex items-center justify-center p-2" onClick={() => setZoomedImage(null)}>
                        <button onClick={() => setZoomedImage(null)} className="absolute top-6 right-6 text-white bg-white/10 p-3 rounded-full hover:bg-white/20 transition-colors z-[110]">
                            <Icons.X />
                        </button>
                        <img src={zoomedImage} className="max-w-full max-h-full object-contain shadow-2xl rounded-lg pointer-events-none" />
                    </div>
                )}

                {/* MODAL: PROCESSING SPINNER */}
                {isProcessing && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[90] flex flex-col items-center justify-center p-4">
                        <div className="w-12 h-12 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold text-white">Elaborazione Foto...</h2>
                    </div>
                )}

                {/* MODAL: SETTINGS & PROFILE */}
                {settingsOpen && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[60] flex items-center justify-center p-4" onClick={() => setSettingsOpen(false)}>
                        <div className="glass-panel rounded-3xl w-full max-w-sm relative text-center border-white/20 p-8 shadow-2xl" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setSettingsOpen(false)} className="absolute top-4 right-4 text-white/50 hover:text-white"><Icons.X /></button>
                            <div className="flex justify-center text-white mb-4"><Icons.User /></div>
                            <h2 className="text-2xl font-black text-white mb-1">Profilo</h2>
                            <p className="text-white/60 text-sm mb-8">{user.email}</p>
                            
                            <button onClick={handleLogout} className="w-full py-3 bg-rose-500/20 hover:bg-rose-500/40 border border-rose-500/50 text-rose-300 font-bold rounded-xl transition-colors flex justify-center items-center gap-2">
                                <Icons.LogOut /> Disconnettiti
                            </button>
                        </div>
                    </div>
                )}

                {/* MODAL: DUPLICATE CHECK WARNING */}
                {duplicateModal.isOpen && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[80] flex items-center justify-center p-4" onClick={() => setDuplicateModal({ isOpen: false, newDocData: null, existingDocId: null })}>
                        <div className="glass-panel rounded-3xl w-full max-w-sm relative text-center border-amber-500/30 p-8 shadow-[0_0_50px_rgba(251,191,36,0.15)]" onClick={e => e.stopPropagation()}>
                            <div className="flex justify-center mb-4"><Icons.Warning /></div>
                            <h2 className="text-2xl font-black text-white mb-2">Attività Esistente!</h2>
                            <p className="text-white/80 text-sm mb-8">
                                Hai già un'attività chiamata "<span className="font-bold text-amber-300">{duplicateModal.newDocData.name}</span>" in archivio.<br/><br/>Vuoi sostituire la vecchia o tenerle entrambe?
                            </p>
                            
                            <div className="flex flex-col gap-3">
                                <button onClick={handleReplaceDuplicate} className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl transition-colors shadow-lg">
                                    Sostituisci la vecchia
                                </button>
                                <button onClick={() => executeSaveToDb(duplicateModal.newDocData)} className="w-full py-3.5 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold rounded-xl transition-colors">
                                    Tieni entrambe
                                </button>
                                <button onClick={() => setDuplicateModal({ isOpen: false, newDocData: null, existingDocId: null })} className="w-full py-2 text-white/50 text-sm font-semibold hover:text-white mt-2">
                                    Annulla salvataggio
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL: VIEW DETAILS / DELETE */}
                {selectedDoc && !zoomedImage && (
                    <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[50] flex items-center justify-center p-4" onClick={() => setSelectedDoc(null)}>
                        <div className="glass-panel rounded-3xl w-full max-w-sm relative flex flex-col max-h-[85vh] overflow-hidden shadow-2xl" onClick={e => e.stopPropagation()}>
                            <div className="p-6 pb-2 border-b border-white/10 flex justify-between items-center bg-white/5">
                                <div>
                                    <h2 className="text-2xl font-black text-white leading-tight">{selectedDoc.name}</h2>
                                    <p className="text-sky-300 font-bold uppercase tracking-widest text-[10px] mt-1">{selectedDoc.category}</p>
                                </div>
                                <button onClick={() => setSelectedDoc(null)} className="text-white/50 hover:text-white bg-black/20 rounded-full p-2"><Icons.X /></button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-4">
                                <div className="grid grid-cols-2 gap-3 text-left">
                                    <div className="bg-black/20 rounded-2xl p-4 border border-white/5 shadow-inner">
                                        <p className="text-[10px] uppercase text-white/50 font-bold">Svolgimento</p>
                                        <p className="font-semibold text-white mt-1 text-sm">{selectedDoc.dataSvolgimento ? new Date(selectedDoc.dataSvolgimento).toLocaleDateString('it-IT') : '-'}</p>
                                    </div>
                                    <div className={`bg-black/20 rounded-2xl p-4 border shadow-inner ${selectedDoc.scadenza && getExpiryStatus(selectedDoc.scadenza).color.includes('rose') ? 'border-rose-500/50 bg-rose-500/10' : 'border-white/5'}`}>
                                        <p className="text-[10px] uppercase text-white/50 font-bold">
                                            {selectedDoc.scadenza ? (ACTIVITIES.find(a => a.name === selectedDoc.name)?.label || 'Scadenza') : 'Scadenza'}
                                        </p>
                                        <p className={`font-semibold mt-1 text-sm ${getExpiryStatus(selectedDoc.scadenza).color}`}>
                                            {selectedDoc.scadenza ? new Date(selectedDoc.scadenza).toLocaleDateString('it-IT') : 'Nessuna scadenza'}
                                        </p>
                                    </div>
                                </div>

                                {selectedDoc.note && (
                                    <div className="bg-white/5 rounded-2xl p-4 border border-white/10">
                                        <p className="text-[10px] uppercase text-white/50 font-bold mb-1">Note / Dettagli</p>
                                        <p className="text-sm text-white/90 whitespace-pre-wrap leading-relaxed">{selectedDoc.note}</p>
                                    </div>
                                )}

                                {selectedDoc.photo ? (
                                    <div onClick={() => setZoomedImage(selectedDoc.photo)} className="w-full relative rounded-2xl border border-white/20 overflow-hidden bg-black/40 shadow-xl cursor-pointer group">
                                        <img src={selectedDoc.photo} className="w-full h-48 object-cover opacity-90 group-hover:opacity-100 transition-opacity" />
                                        <div className="absolute inset-0 flex items-center justify-center bg-black/0 group-hover:bg-black/30 transition-colors">
                                            <div className="bg-black/50 p-3 rounded-full backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity"><Icons.ZoomIn /></div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="w-full h-24 rounded-2xl border border-dashed border-white/20 flex flex-col items-center justify-center text-white/30 bg-black/20">
                                        <Icons.File />
                                        <span className="text-xs mt-2 font-medium">Nessun documento allegato</span>
                                    </div>
                                )}
                            </div>
                            
                            <div className="p-4 bg-white/5 border-t border-white/10">
                                <button onClick={confirmDeleteDoc} className="w-full py-3.5 bg-rose-500/90 hover:bg-rose-500 text-white font-bold rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2">
                                    <Icons.Trash /> Elimina Registrazione
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL: ADD DOCUMENT */}
                {isAddOpen && (
                  <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[45] flex items-center justify-center p-4 pt-10">
                    <div className="glass-panel rounded-3xl w-full max-w-sm relative flex flex-col max-h-[85vh] border-t border-white/30 shadow-2xl">
                      <div className="p-6 pb-4 flex justify-between items-center border-b border-white/10">
                          <h2 className="text-2xl font-bold text-white flex items-center gap-2">Nuova Scadenza</h2>
                          <button onClick={() => { setIsAddOpen(false); setPhotoProcessed(null); setSearchTerm(''); setHasDeadline(true); }} className="text-white/50 hover:text-white bg-black/20 rounded-full p-2"><Icons.X /></button>
                      </div>
                      
                      <div className="p-6 overflow-y-auto no-scrollbar space-y-5">
                        
                        {/* Auto-complete Search Box */}
                        <div className="relative">
                            <label className="text-[10px] font-bold text-sky-300 uppercase tracking-wider mb-1.5 flex items-center gap-1"><Icons.Search /> Cerca Attività / Documento</label>
                            <input 
                                type="text"
                                className="block w-full bg-black/30 border border-white/20 rounded-xl p-3 text-white placeholder:text-white/40 focus:ring-2 focus:ring-sky-400 outline-none text-sm"
                                placeholder="Es. Bollo Auto, Patente, ISEE..."
                                value={searchTerm}
                                onChange={(e) => { 
                                    setSearchTerm(e.target.value); 
                                    setShowSearchDropdown(true); 
                                    setNewDoc({...newDoc, name: e.target.value}); 
                                    // Se scrivendo trova un match esatto, aggiorna l'intervallo
                                    const match = ACTIVITIES.find(a => a.name.toLowerCase() === e.target.value.toLowerCase());
                                    if(match && match.defaultInterval) setSelectedInterval(match.defaultInterval.toString());
                                    else setSelectedInterval('manual');
                                }}
                                onFocus={() => setShowSearchDropdown(true)}
                            />
                            {showSearchDropdown && searchTerm && (
                                <div className="absolute top-full left-0 right-0 mt-2 bg-slate-800/95 backdrop-blur-xl border border-white/20 rounded-xl max-h-48 overflow-y-auto z-50 shadow-2xl">
                                    {filteredActivities.length > 0 ? filteredActivities.map(act => (
                                        <div key={act.name} onClick={() => { 
                                            setSearchTerm(act.name); 
                                            setNewDoc({...newDoc, name: act.name}); 
                                            setSelectedInterval(act.defaultInterval ? act.defaultInterval.toString() : 'manual');
                                            setShowSearchDropdown(false); 
                                        }} className="p-3 hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0">
                                            <div className="text-sm font-semibold text-white">{act.name}</div>
                                            <div className="text-[10px] text-sky-200 uppercase">{act.cat}</div>
                                        </div>
                                    )) : (
                                        <div className="p-3 text-xs text-white/50 italic">Nessun risultato. Verrà salvato come "Varie".</div>
                                    )}
                                </div>
                            )}
                        </div>
                        
                        {/* Toggle No Scadenza */}
                        <div className="flex items-center justify-between bg-black/30 p-3 rounded-xl border border-white/10">
                            <span className={`text-xs font-bold uppercase tracking-wider ${hasDeadline ? 'text-white' : 'text-white/50'}`}>
                                {hasDeadline ? dynamicLabelAddForm : 'Nessuna scadenza'}
                            </span>
                            <div className="relative inline-block w-12 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle" id="toggle" checked={hasDeadline} onChange={(e) => setHasDeadline(e.target.checked)} className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label htmlFor="toggle" className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Svolgimento (Opz.)</label>
                                <GlassDateInput placeholder="Data Svolgimento" value={newDoc.dataSvolgimento} onChange={(e) => setNewDoc({...newDoc, dataSvolgimento: e.target.value})} />
                            </div>
                            <div className={`transition-opacity duration-300 ${hasDeadline ? 'opacity-100' : 'opacity-20 pointer-events-none'}`}>
                                <label className="text-[10px] font-bold text-rose-300 uppercase tracking-wider mb-1.5 block">{hasDeadline ? dynamicLabelAddForm : 'Scadenza'} *</label>
                                
                                {hasIntervals ? (
                                    <div className="space-y-2">
                                        <select 
                                            value={selectedInterval} 
                                            onChange={(e) => setSelectedInterval(e.target.value)}
                                            className="block w-full bg-black/20 border border-white/10 rounded-xl p-3 text-white focus:ring-2 focus:ring-sky-300 outline-none text-sm appearance-none"
                                            style={{ backgroundImage: `url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e")`, backgroundPosition: `right 0.5rem center`, backgroundRepeat: `no-repeat`, backgroundSize: `1.5em 1.5em` }}
                                        >
                                            {currentActivityDef.intervals.map(months => (
                                                <option key={months} value={months} className="text-black bg-white">
                                                    Tra {months >= 12 ? (months % 12 === 0 ? (months === 12 ? '1 anno' : `${months/12} anni`) : `${months} mesi`) : (months === 1 ? '1 mese' : `${months} mesi`)}
                                                </option>
                                            ))}
                                            <option value="manual" className="text-black bg-white">Data manuale...</option>
                                        </select>
                                        {selectedInterval === 'manual' && (
                                            <div className="mt-2 animate-pulse"><GlassDateInput placeholder="Inserisci Data" value={newDoc.scadenza} onChange={(e) => setNewDoc({...newDoc, scadenza: e.target.value})} /></div>
                                        )}
                                    </div>
                                ) : (
                                    <GlassDateInput placeholder="Scadenza" value={newDoc.scadenza} onChange={(e) => setNewDoc({...newDoc, scadenza: e.target.value})} />
                                )}
                            </div>
                        </div>

                        <div>
                            <label className="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Note (Opzionale)</label>
                            <textarea 
                                className="block w-full bg-black/20 border border-white/10 rounded-xl p-3 text-white placeholder:text-white/30 focus:ring-1 focus:ring-white/30 outline-none text-sm resize-none h-20" 
                                placeholder="Aggiungi dettagli, importi, riferimenti..."
                                value={newDoc.note}
                                onChange={(e) => setNewDoc({...newDoc, note: e.target.value})}
                            ></textarea>
                        </div>
                        
                        <div>
                            <label className="text-[10px] font-bold text-sky-300 uppercase tracking-wider mb-1.5 block">Scansione / Foto (Opz.)</label>
                            <label className={`flex items-center justify-center w-full p-4 bg-black/20 border border-dashed rounded-xl cursor-pointer hover:bg-black/40 transition-colors text-sm font-medium ${photoProcessed ? 'border-sky-400 text-sky-300' : 'border-white/20 text-white/60'}`}>
                                <Icons.Camera />
                                <span className="ml-2">{photoProcessed ? "Immagine Acquisita" : "Carica Foto"}</span>
                                <input type="file" accept="image/*" className="hidden" onChange={handlePhotoSelection} />
                            </label>

                            {photoProcessed && (
                                <div className="mt-3 w-full h-32 rounded-xl overflow-hidden border border-white/20 bg-black/50 relative">
                                    <img src={photoProcessed} className="w-full h-full object-cover" />
                                    <button onClick={(e) => { e.preventDefault(); setPhotoProcessed(null); }} className="absolute top-2 right-2 bg-black/50 p-1.5 rounded-full text-white hover:bg-rose-500/80"><Icons.X /></button>
                                </div>
                            )}
                        </div>

                        <button onClick={handleSaveRequest} className="w-full py-4 bg-gradient-to-r from-sky-600 to-sky-400 hover:scale-[1.02] text-white font-bold rounded-xl transition-transform shadow-[0_4px_15px_rgba(14,165,233,0.4)] flex items-center justify-center gap-2 mt-4 text-lg">
                          <Icons.Save /> Salva nell'archivio
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
